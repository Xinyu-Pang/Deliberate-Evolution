    k: 8
    cooldown: 4
    top_k: 5
    residual_analysis_top_n: 2
    failed_mutations: 3
    failed_parent_top_percent: 0.2
  general:
    insights_n: 3
    max_entries: 1
    min_improvement: 0.0
    debug_save_memory: true